name: Add a paper
description: Suggest a paper for the clustering research catalog
title: "[Paper] "
labels: [paper]
body:
  - type: input
    id: title
    attributes:
      label: Paper title
    validations:
      required: true
  - type: input
    id: paper
    attributes:
      label: Primary paper page
      description: Prefer a publisher, anthology, OpenReview, CVF, or arXiv abstract page.
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Official code
  - type: checkboxes
    id: tags
    attributes:
      label: Tags
      description: Select every tag that materially applies.
      options:
        - label: BIO — biological or medical clustering
        - label: HG — hypergraph clustering
        - label: LLM — LLM-enhanced clustering
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why it belongs
      description: One or two sentences explaining the clustering contribution and tags.
    validations:
      required: true
